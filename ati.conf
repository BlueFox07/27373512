<VirtualHost *:80>
    DocumentRoot /var/www/html
    
    # Configuración WSGI básica
    WSGIDaemonProcess ati python-path=/var/www/html/ATI
    WSGIProcessGroup ati
    WSGIScriptAlias /ATI/index.py /var/www/html/ATI/index.py
    
    # Permisos para el directorio
    <Directory /var/www/html/ATI>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # IMPORTANTE: Permitir archivos .py como CGI/WSGI
    AddHandler wsgi-script .py
    
    # Archivos estáticos
    Alias /ATI/css/ /var/www/html/ATI/css/
    Alias /ATI/js/ /var/www/html/ATI/js/
    Alias /ATI/conf/ /var/www/html/ATI/conf/
    Alias /ATI/datos/ /var/www/html/ATI/datos/
    Alias /ATI/images/ /var/www/html/ATI/images/
    
    # Configuración para favicon
    Alias /favicon.ico /var/www/html/ATI/favicon.ico
</VirtualHost>